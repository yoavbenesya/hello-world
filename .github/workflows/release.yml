name: release

on:
  push:
    branches: [main]

permissions:
  contents: write   # create the version tag
  id-token: write   # request an OIDC token for AWS

concurrency:
  group: release
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-2
  AWS_ROLE_ARN: arn:aws:iam::030454160336:role/exam-github-actions
  ECR_REPOSITORY: hello-world

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute next version
        id: version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true

      - name: Debug OIDC token claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 - "$TOKEN" <<'EOF'
          import sys, json, base64
          payload = sys.argv[1].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print(json.dumps({k: claims.get(k) for k in ("sub", "aud", "iss")}, indent=2))
          EOF

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          VERSION: ${{ steps.version.outputs.new_version }}
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.new_version }}
        run: |
          docker build --build-arg APP_VERSION="$VERSION" -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Tag the commit
        env:
          TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"